<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רישום אורח - סי אנד סאן</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>מגדלי סי אנד סאן</h1>
    <p>רישום אורחים במחסום</p>
  </div>

  <form id="form" class="card" novalidate>
    <label for="plate">מספר רכב</label>
    <input id="plate" name="plate" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="לדוגמה 123-45-678" class="ltr">
    <div class="err" data-for="plate"></div>

    <label for="phone">מספר טלפון</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="15" placeholder="050-1234567" class="ltr">
    <div class="err" data-for="phone"></div>

    <label for="host">למי אתם מגיעים?</label>
    <input id="host" name="host" type="text" autocomplete="off" maxlength="80" placeholder="שם הדייר / מספר דירה">
    <div class="err" data-for="host"></div>

    <div class="err" id="general"></div>
    <button class="full" id="submit" type="submit">שליחה</button>
  </form>

  <div id="done" class="card center" hidden>
    <div class="big-icon state-pending" id="icon">⏳</div>
    <h2 id="title">הפרטים נשלחו</h2>
    <p id="msg">פקיד הקבלה קיבל את הרישום שלכם. נא להמתין במחסום.</p>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const form = $('#form');

form.addEventListener('submit', async e => {
  e.preventDefault();
  document.querySelectorAll('.err').forEach(x => x.textContent = '');
  document.querySelectorAll('input').forEach(x => x.classList.remove('invalid'));
  const btn = $('#submit'); btn.disabled = true;
  try {
    const res = await fetch('/api/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({plate: $('#plate').value, phone: $('#phone').value, host: $('#host').value})
    });
    const data = await res.json();
    if (!res.ok) {
      for (const [k, v] of Object.entries(data.fields || {})) {
        document.querySelector(`[data-for="${k}"]`).textContent = v;
        document.getElementById(k).classList.add('invalid');
      }
      if (!data.fields) $('#general').textContent = data.error;
      else $('#general').textContent = data.error;
      btn.disabled = false;
      return;
    }
    form.hidden = true; $('#done').hidden = false;
    try { localStorage.setItem('last', JSON.stringify({plate: $('#plate').value, phone: $('#phone').value})); } catch {}
    poll(data.token);
  } catch {
    $('#general').textContent = 'שגיאת תקשורת. נסו שוב.';
    btn.disabled = false;
  }
});

try {
  const last = JSON.parse(localStorage.getItem('last') || 'null');
  if (last) { $('#plate').value = last.plate; $('#phone').value = last.phone; }
} catch {}

function poll(token) {
  const t = setInterval(async () => {
    try {
      const r = await fetch('/api/status/' + token); if (!r.ok) return;
      const {status} = await r.json();
      if (status === 'entered') {
        clearInterval(t);
        $('#icon').textContent = '✅'; $('#icon').className = 'big-icon state-entered';
        $('#title').textContent = 'אושרה כניסה'; $('#msg').textContent = 'המחסום נפתח. נסיעה טובה!';
      } else if (status === 'rejected') {
        clearInterval(t);
        $('#icon').textContent = '⛔'; $('#icon').className = 'big-icon state-rejected';
        $('#title').textContent = 'לא ניתן להיכנס'; $('#msg').textContent = 'נא לפנות לפקיד הקבלה במחסום.';
      }
    } catch {}
  }, 3000);
}
</script>
</body>
</html>
