<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ברקוד לשלט המחסום</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; text-align: center; margin: 0; padding: 30px; color: #12263a; }
  h1 { font-size: 44px; margin: 0 0 6px; color: #0a6ea8; }
  h2 { font-size: 30px; margin: 0 0 24px; font-weight: 600; }
  img { width: 420px; max-width: 80vw; border: 6px solid #0a6ea8; border-radius: 20px; padding: 14px; }
  p { font-size: 24px; }
  .url { direction: ltr; color: #5b6f82; font-size: 18px; }
  .noprint a { font-size: 16px; }
  @media print { .noprint { display: none; } }
</style>
</head>
<body>
  <h1>מגדלי סי אנד סאן</h1>
  <h2>אורחים: סרקו את הברקוד ומלאו פרטים<br>לפני הכניסה למחסום</h2>
  <img src="/qr.png" alt="QR">
  <p>מספר רכב · טלפון · למי אתם מגיעים</p>
  <p class="url">{{ url }}</p>
  <p class="noprint"><button onclick="print()">הדפסה</button> · <a href="/reception">חזרה</a></p>
</body>
</html>
