<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d4a6b">
<title>רישום אורח - סי אנד סאן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="hero">
  <div class="hero-text">
    <p class="eyebrow">מחסום · רישום אורחים</p>
    <h1>מגדלי סי אנד סאן</h1>
    <p class="sub">מלאו את הפרטים והקבלה תפתח לכם את השער</p>
  </div>
  <svg class="skyline" viewBox="0 0 480 150" aria-hidden="true">
      <circle cx="372" cy="78" r="40" fill="#f2a900"/>
      <circle cx="372" cy="78" r="58" fill="#f2a900" opacity=".14"/>
      <g fill="var(--tower)"><rect x="150" y="22" width="52" height="128" rx="2"/><rect x="208" y="58" width="44" height="92" rx="2"/><rect x="258" y="86" width="30" height="64" rx="2"/></g>
      <g fill="var(--tower-2)"><rect x="150" y="22" width="12" height="128"/><rect x="208" y="58" width="10" height="92"/></g>
      <g stroke="#f7c948" stroke-width="3" stroke-dasharray="4 11" opacity=".75"><line x1="172" y1="34" x2="172" y2="138"/><line x1="186" y1="34" x2="186" y2="138"/><line x1="230" y1="70" x2="230" y2="138"/><line x1="242" y1="70" x2="242" y2="138"/></g>
      <path class="sea" d="M0,128 C60,118 120,138 190,128 C260,118 320,138 390,128 C430,122 460,128 480,126 L480,150 L0,150 Z"/>
      <path d="M0,128 C60,118 120,138 190,128 C260,118 320,138 390,128 C430,122 460,128 480,126" fill="none" stroke="var(--sea-line)" stroke-width="2"/>
    </svg>
</header>
<div class="wrap">
  <form id="form" class="card lift" novalidate>
    <div class="field">
      <label for="plate">מספר רכב<span class="req">*</span><span class="hint">7 או 8 ספרות</span></label>
      <div class="plate-box" id="plateBox">
        <div class="flag">IL</div>
        <input id="plate" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="12-345-67" required aria-required="true">
      </div>
      <div class="err" data-for="plate"></div>
    </div>

    <div class="field">
      <label for="phone">מספר טלפון<span class="req">*</span></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="12" placeholder="050-123-4567" class="ltr" required aria-required="true">
      <div class="err" data-for="phone"></div>
    </div>

    <div class="field">
      <label for="host">למי אתם מגיעים?<span class="req">*</span></label>
      <input id="host" type="text" autocomplete="off" maxlength="80" placeholder="שם הדייר או מספר דירה" required aria-required="true">
      <div class="err" data-for="host"></div>
    </div>

    <div class="err center" id="general"></div>
    <button class="full" id="submit" type="submit">שליחה לקבלה</button>
    <p class="note">כל השדות חובה · הפרטים נראים רק לצוות הקבלה</p>
  </form>

  <div id="done" class="card lift center" hidden>
    <div class="status-dot pending" id="icon">…</div>
    <h2 class="done-title" id="title">הפרטים נשלחו</h2>
    <p class="done-msg" id="msg">פקיד הקבלה קיבל את הרישום שלכם. נא להמתין במחסום.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=5"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const form = $('#form');

// ---- ניקוי ואימות ----
const digits = v => v.replace(/\D/g, '');
const cleanPlate = v => { const d = digits(v); return d.length === 7 || d.length === 8 ? d : null; };
const cleanPhone = v => {
  let d = v.replace(/[\s\-()]/g, '');
  if (d.startsWith('+972')) d = '0' + d.slice(4);
  else if (d.startsWith('972')) d = '0' + d.slice(3);
  return /^(05\d{8}|07\d{8}|0[23489]\d{7})$/.test(d) ? d : null;
};
const cleanHost = v => { v = v.replace(/\s+/g, ' ').trim(); return v.length >= 2 && v.length <= 80 ? v : null; };

// ---- עיצוב תוך כדי הקלדה ----
$('#plate').addEventListener('input', e => {
  const d = digits(e.target.value).slice(0, 8);
  e.target.value = d.length <= 7 ? [d.slice(0, 2), d.slice(2, 5), d.slice(5)].filter(Boolean).join('-')
                                 : [d.slice(0, 3), d.slice(3, 5), d.slice(5)].filter(Boolean).join('-');
});
$('#phone').addEventListener('input', e => {
  const d = digits(e.target.value).slice(0, 10);
  e.target.value = d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
});

const rules = {
  plate: [cleanPlate, v => !digits(v) ? 'נא למלא מספר רכב' : 'מספר רכב חייב להכיל 7 או 8 ספרות'],
  phone: [cleanPhone, v => !v.trim() ? 'נא למלא מספר טלפון' : 'מספר טלפון חייב להכיל 10 ספרות (נייד) או 9 ספרות (קווי)'],
  host:  [cleanHost,  v => 'נא לציין למי אתם מגיעים'],
};
function check(k, showOk = true) {
  const el = $('#' + k), [fn, msg] = rules[k], val = fn(el.value);
  const box = k === 'plate' ? $('#plateBox') : el;
  box.classList.toggle('invalid', !val);
  document.querySelector(`[data-for="${k}"]`).textContent = val ? '' : msg(el.value);
  return val;
}
for (const k of Object.keys(rules)) {
  $('#' + k).addEventListener('blur', () => check(k));
  $('#' + k).addEventListener('input', () => { if ($('#' + k).classList.contains('invalid') || $('#plateBox').classList.contains('invalid')) check(k); });
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  $('#general').textContent = '';
  const vals = {};
  let firstBad = null;
  for (const k of Object.keys(rules)) { vals[k] = check(k); if (!vals[k] && !firstBad) firstBad = k; }
  if (firstBad) { $('#' + firstBad).focus(); return; }

  const btn = $('#submit'); btn.disabled = true; btn.textContent = 'שולח…';
  const token = crypto.randomUUID();
  const { error } = await sb.from('seasun_visitors').insert({ token, ...vals });
  if (error) {
    $('#general').textContent = /too_many/.test(error.message)
      ? 'נשלחו יותר מדי רישומים. נא לפנות לפקיד הקבלה.' : 'שגיאה בשליחה. נסו שוב.';
    btn.disabled = false; btn.textContent = 'שליחה לקבלה';
    return;
  }
  form.hidden = true; $('#done').hidden = false;
  try { localStorage.setItem('last', JSON.stringify({ plate: $('#plate').value, phone: $('#phone').value })); } catch {}
  poll(token);
});

try {
  const last = JSON.parse(localStorage.getItem('last') || 'null');
  if (last) { $('#plate').value = last.plate; $('#phone').value = last.phone; }
} catch {}

function poll(token) {
  const t = setInterval(async () => {
    const { data: status } = await sb.rpc('seasun_get_status', { t: token });
    const icon = $('#icon');
    if (status === 'entered') {
      clearInterval(t);
      icon.textContent = '✓'; icon.className = 'status-dot entered';
      $('#title').textContent = 'אושרה כניסה'; $('#msg').textContent = 'המחסום נפתח. נסיעה טובה!';
    } else if (status === 'rejected') {
      clearInterval(t);
      icon.textContent = '✕'; icon.className = 'status-dot rejected';
      $('#title').textContent = 'לא ניתן להיכנס'; $('#msg').textContent = 'נא לפנות לפקיד הקבלה במחסום.';
    }
  }, 3000);
}
</script>
</body>
</html>
