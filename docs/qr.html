<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ברקוד לשלט המחסום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: "Heebo", "Segoe UI", Arial, sans-serif; text-align: center; margin: 0; padding: 24px 20px; color: #0e2a3a; background: #fff; }
  h1 { font-size: 40px; font-weight: 800; line-height: 1.1; margin: 0 0 6px; color: #0d4a6b; }
  .sub { font-size: 16px; font-weight: 400; margin: 0 0 16px; color: #4d6677; }
  #qr { display: inline-block; border: 3px solid #0d4a6b; border-radius: 14px; padding: 10px; background: #fff; }
  #qr img, #qr canvas { display: block; width: 180px; max-width: 70vw; height: auto; }
  .noprint { margin-top: 24px; font-size: 16px; }
  .noprint button { font: inherit; padding: 8px 18px; cursor: pointer; }
  @media print { .noprint { display: none; } }
</style>
</head>
<body>
  <h1>רישום אורחים</h1>
  <p class="sub">סרקו את הברקוד ומלאו את פרטיכם</p>
  <div id="qr"></div>
  <p class="noprint"><button onclick="print()">הדפסה</button> &nbsp; <a href="reception.html">חזרה</a></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const url = new URL('./', location.href).href;
  new QRCode(document.getElementById('qr'), { text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.Q });
</script>
</body>
</html>
