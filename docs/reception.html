<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך קבלה - סי אנד סאן</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
<style>
  .wide { max-width: 1000px; }
  #app > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 22px 0 6px; }
  #app > header h1 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--text); }
  #app > header nav { display: flex; gap: 8px; align-items: center; }
  #app > header nav a, #app > header nav button { height: 40px; padding: 0 14px; font-size: 15px; }
  h2 { font-size: 20px; font-weight: 800; margin: 28px 0 10px; display: flex; align-items: center; gap: 10px; }
  .count { background: var(--sun); color: #3a2a00; border-radius: 999px; padding: 1px 11px; font-size: 14px; font-weight: 800; }
  .row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
         display: grid; grid-template-columns: 1.2fr 1.2fr 1.6fr auto; gap: 12px; align-items: center; }
  .row.new { border-color: var(--sun); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sun) 35%, transparent); animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--primary) 25%, var(--card)); } }
  .small { color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; }
  .actions button { height: 48px; padding: 0 22px; font-size: 17px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; background: var(--card); border: 1px dashed var(--border); border-radius: 12px; }
  .badge { font-weight: 700; }
  #search { margin: 10px 0 0; }
  #conn { font-size: 13px; color: var(--bad); }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr 1fr; } .actions { grid-column: 1 / -1; } .actions button { flex: 1; } }
</style>
</head>
<body>
<div class="wrap" id="login" hidden>
  <header class="hero"><div class="hero-text"><h1>מגדלי סי אנד סאן</h1><p class="sub">כניסת פקידי קבלה</p></div>
  <svg class="skyline" viewBox="0 0 480 150" aria-hidden="true">
      <circle cx="372" cy="78" r="40" fill="#f2a900"/>
      <g fill="var(--tower)"><rect x="150" y="22" width="52" height="128" rx="2"/><rect x="208" y="58" width="44" height="92" rx="2"/><rect x="258" y="86" width="30" height="64" rx="2"/></g>
      <g fill="var(--tower-2)"><rect x="150" y="22" width="12" height="128"/><rect x="208" y="58" width="10" height="92"/></g>
      <g stroke="#f7c948" stroke-width="3" stroke-dasharray="4 11" opacity=".75"><line x1="172" y1="34" x2="172" y2="138"/><line x1="186" y1="34" x2="186" y2="138"/><line x1="230" y1="70" x2="230" y2="138"/><line x1="242" y1="70" x2="242" y2="138"/></g>
      <path class="sea" d="M0,128 C60,118 120,138 190,128 C260,118 320,138 390,128 C430,122 460,128 480,126 L480,150 L0,150 Z"/>
      <path d="M0,128 C60,118 120,138 190,128 C260,118 320,138 390,128 C430,122 460,128 480,126" fill="none" stroke="var(--sea-line)" stroke-width="2"/>
    </svg>
</header>
  <form class="card lift" id="loginForm">
    <div class="field"><label for="password">סיסמה</label>
    <input id="password" type="password" autocomplete="off">
    <div class="err" id="loginErr"></div></div>
    <button class="full" type="submit">כניסה</button>
  </form>
</div>
<div class="wrap wide" id="app" hidden>
  <header>
    <h1>מסך הקבלה</h1>
    <nav>
      <span id="conn"></span>
      <button class="ghost" id="sound">צליל: פעיל</button>
      <a class="btn ghost" href="qr.html">ברקוד להדפסה</a>
      <button class="ghost" id="logout">יציאה</button>
    </nav>
  </header>

  <input id="search" type="search" placeholder="חיפוש לפי מספר רכב, טלפון או דייר...">

  <h2>ממתינים בשער <span class="count" id="pcount">0</span></h2>
  <div id="pending"></div>

  <h2>טופלו היום <span class="count" id="dcount" style="background:var(--muted)">0</span></h2>
  <div id="done"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=5"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
let seen = null, soundOn = true, data = {pending: [], done: []};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPlate = p => p.length === 8 ? `${p.slice(0,3)}-${p.slice(3,5)}-${p.slice(5)}` : p.length === 7 ? `${p.slice(0,2)}-${p.slice(2,5)}-${p.slice(5)}` : p;
const fmtPhone = p => p.length === 10 ? `${p.slice(0,3)}-${p.slice(3)}` : p;
const time = iso => iso ? new Date(iso).toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit'}) : '';
const ago = iso => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? 'עכשיו' : `לפני ${m} דק׳`; };

$('#sound').onclick = () => { soundOn = !soundOn; $('#sound').textContent = soundOn ? 'צליל: פעיל' : 'צליל: כבוי'; };

function beep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch {}
}

function matches(v, q) {
  if (!q) return true;
  const digits = q.replace(/\D/g, '');
  return v.host.includes(q) || (digits && (v.plate.includes(digits) || v.phone.includes(digits)));
}

function render(newIds = new Set()) {
  const q = $('#search').value.trim();
  const p = data.pending.filter(v => matches(v, q)), d = data.done.filter(v => matches(v, q));
  $('#pcount').textContent = data.pending.length; $('#dcount').textContent = data.done.length;
  $('#pending').innerHTML = p.length ? p.map(v => `
    <div class="row ${newIds.has(v.id) ? 'new' : ''}">
      <div><span class="plate-chip">${esc(fmtPlate(v.plate))}</span><div class="small">${esc(ago(v.created_at))}, ${esc(time(v.created_at))}</div></div>
      <div><div class="small">טלפון</div><a class="ltr" href="tel:${esc(v.phone)}" style="color:inherit;direction:ltr;display:inline-block">${esc(fmtPhone(v.phone))}</a></div>
      <div><div class="small">מגיע אל</div><b>${esc(v.host)}</b></div>
      <div class="actions"><button class="ok" onclick="act(${v.id},'enter')">הכנס ✔</button><button class="bad" onclick="act(${v.id},'reject')">דחה</button></div>
    </div>`).join('') : '<div class="empty">אין אורחים ממתינים</div>';
  $('#done').innerHTML = d.length ? d.map(v => `
    <div class="row" style="opacity:.85">
      <div><span class="plate-chip sm">${esc(fmtPlate(v.plate))}</span><div class="small">נרשם ${esc(time(v.created_at))}</div></div>
      <div class="ltr small" style="direction:ltr">${esc(fmtPhone(v.phone))}</div>
      <div>${esc(v.host)}</div>
      <div class="actions"><span class="badge state-${v.status}">${v.status === 'entered' ? 'נכנס' : 'נדחה'} ${esc(time(v.handled_at))}</span>
        <button class="ghost" style="padding:6px 10px;font-size:14px" onclick="act(${v.id},'undo')">בטל</button></div>
    </div>`).join('') : '<div class="empty">עדיין לא טופלו אורחים היום</div>';
}

const getPw = () => { try { return sessionStorage.getItem('pw') || ''; } catch { return ''; } };

async function act(id, action) {
  const st = action === 'undo' ? 'pending' : action === 'enter' ? 'entered' : 'rejected';
  const {error} = await sb.rpc('seasun_handle', {pw: getPw(), vid: id, new_status: st});
  if (error) return alert('הפעולה נכשלה. נסו שוב.');
  load();
}

async function load() {
  const {data: rows, error} = await sb.rpc('seasun_list', {pw: getPw()});
  if (error) {
    if (/unauthorized/.test(error.message)) return show(false);
    $('#conn').textContent = '⚠ אין חיבור לשרת'; return;
  }
  $('#conn').textContent = '';
  data = {
    pending: rows.filter(v => v.status === 'pending'),
    done: rows.filter(v => v.status !== 'pending').sort((x, y) => new Date(y.handled_at) - new Date(x.handled_at))
  };
  const ids = new Set(data.pending.map(v => v.id));
  const fresh = seen ? new Set([...ids].filter(i => !seen.has(i))) : new Set();
  if (fresh.size) beep();
  seen = ids;
  render(fresh);
}

let timer;
function show(loggedIn) {
  $('#login').hidden = loggedIn; $('#app').hidden = !loggedIn;
  clearInterval(timer);
  if (loggedIn) { seen = null; load(); timer = setInterval(load, 3000); }
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#password').value;
  const {data: rows, error} = await sb.rpc('seasun_list', {pw});
  if (error) { $('#loginErr').textContent = /unauthorized/.test(error.message) ? 'סיסמה שגויה' : 'שגיאת תקשורת'; return; }
  try { sessionStorage.setItem('pw', pw); } catch {}
  $('#password').value = '';
  show(true);
});
$('#logout').onclick = () => { try { sessionStorage.removeItem('pw'); } catch {} show(false); };
show(!!getPw());
$('#search').addEventListener('input', () => render());
</script>
</body>
</html>
